[package]
name = "kimaier"
version = "0.11.0"
edition = "2024"
rust-version = "1.87"

[build-dependencies]
slint-build = "1.13"

[dependencies]
chrono = "0.4"
directories-next = "2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.13", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg"] }
self_update = { version = "0.42", features = ["rustls", "archive-tar", "compression-flate2", "compression-zip-deflate"] }
