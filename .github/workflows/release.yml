name: Release
on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:

permissions:
    contents: write

jobs:
    release-notes:
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        outputs:
            body: ${{ steps.build_changelog.outputs.changelog }}
        steps:
            - name: Checkout release history
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Build release notes
              id: build_changelog
              uses: mikepenz/release-changelog-builder-action@v3
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  commitMode: true
                  toTag: ${{ github.ref_name }}
                  failOnError: true
                  configurationJson: |
                      {
                          "categories": [
                              {
                                  "title": "## Changes",
                                  "labels": []
                              }
                          ],
                          "template": "#{{CHANGELOG}}",
                          "pr_template": "- #{{TITLE}}",
                          "empty_template": "No changes since the previous release."
                      }

    release:
        needs: release-notes
        # For manual runs, select an existing v* tag in the GitHub UI.
        if: startsWith(github.ref, 'refs/tags/v')
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: 'macos-latest'
                      args: '--target aarch64-apple-darwin'
                    - platform: 'macos-latest'
                      args: '--target x86_64-apple-darwin'
                    - platform: 'ubuntu-latest'
                      args: ''
                    - platform: 'windows-latest'
                      args: ''
        runs-on: ${{ matrix.platform }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Install dependencies (ubuntu only)
              if: matrix.platform == 'ubuntu-latest'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

            - name: Rust setup
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

            - name: Rust cache
              uses: swatinem/rust-cache@v2
              with:
                  workspaces: './src-tauri -> target'

            - name: Sync node version and setup cache
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Install app dependencies
              run: npm ci

            - name: Prepare Apple API key
              if: runner.os == 'macOS'
              shell: bash
              env:
                  APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
                  APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
                  APPLE_API_ISSUER: ${{ vars.APPLE_ISSUER_ID }}
              run: |
                  set -euo pipefail
                  if [[ -z "$APPLE_API_PRIVATE_KEY" || -z "$APPLE_API_KEY" || -z "$APPLE_API_ISSUER" ]]; then
                      echo "::error::Missing APPLE_API_PRIVATE_KEY, APPLE_API_KEY_ID or APPLE_ISSUER_ID."
                      exit 1
                  fi
                  key_path="$RUNNER_TEMP/kimaier-apple-api-key.p8"
                  umask 077
                  printf '%s' "$APPLE_API_PRIVATE_KEY" > "$key_path"
                  echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

            - name: Build the app
              uses: tauri-apps/tauri-action@v1

              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
                  APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
                  APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
                  APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
                  APPLE_API_KEY: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY_ID || '' }}
                  APPLE_API_ISSUER: ${{ runner.os == 'macOS' && vars.APPLE_ISSUER_ID || '' }}

              with:
                  args: ${{ matrix.args }}
                  tagName: ${{ github.ref_name }} # This only works if your workflow triggers on new tags.
                  releaseName: 'Kimaier v__VERSION__' # tauri-action replaces \_\_VERSION\_\_ with the app version.
                  releaseBody: |
                      ${{ needs.release-notes.outputs.body }}

                      See the assets to download this version.
                  releaseDraft: true
                  prerelease: false

            - name: Remove Apple API key
              if: always() && runner.os == 'macOS'
              shell: bash
              run: rm -f "$RUNNER_TEMP/kimaier-apple-api-key.p8"
